<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Auth Extension</title>
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }
    .status {
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 15px;
    }
    .authenticated {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .not-authenticated {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .user-info {
      margin: 10px 0;
      padding: 10px;
      background-color: #f8f9fa;
      border-radius: 4px;
    }
    .user-info strong {
      display: block;
      margin-bottom: 5px;
    }
    .user-info div {
      font-size: 12px;
      color: #666;
      margin: 3px 0;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      margin-top: 10px;
    }
    .btn-primary {
      background-color: #007bff;
      color: white;
    }
    .btn-primary:hover {
      background-color: #0056b3;
    }
    .btn-danger {
      background-color: #dc3545;
      color: white;
    }
    .btn-danger:hover {
      background-color: #c82333;
    }
    .loading {
      text-align: center;
      color: #666;
    }
  </style>
</head>
<body>
  <div id="loading" class="loading">Loading...</div>

  <div id="content" style="display: none;">
    <div id="status" class="status"></div>

    <div id="userInfo" class="user-info" style="display: none;"></div>

    <button id="loginBtn" class="btn-primary" style="display: none;">Login</button>
    <button id="logoutBtn" class="btn-danger" style="display: none;">Logout</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
